name: Flowzone

on:
  # Internal and fork PRs both run here; forks run with no secrets.
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main, master]
  # Fork contributions are rebuilt and published from the push to the default
  # branch after merge.
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write # Allow Flowzone to publish to ghcr.io

jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master
    secrets: inherit
    with:
      docker_images: |
        ghcr.io/balena-io/helios
      bake_targets: |
        default,
        unstable
      # The dockerfile runs its own tests so only test building
      # for aarch64
      cargo_targets: aarch64-unknown-linux-gnu
      docker_runs_on: >
        {
          "linux/arm64": ["ubuntu-24.04-arm"],
          "linux/arm/v6": ["ubuntu-24.04-arm"],
          "linux/arm/v7": ["ubuntu-24.04-arm"]
        }
